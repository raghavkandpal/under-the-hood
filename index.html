<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How It Works</title>
<link rel="stylesheet" href="./shared/style.css">
<script src="./shared/theme.js"></script>
<meta name="description" content="Hands-on explainers for the machinery under computing, from networks to neural networks. Each one is a live simulation you can change, step through and break.">
<style>
  .finder { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
  .finder input { flex: 1 1 240px; font-size: 16px; padding: 9px 14px; }
  .finder select { flex: 1 1 140px; max-width: 260px; }
  @media (max-width: 600px) { .finder input { flex-basis: 100%; } .finder select { flex: 1 1 0; min-width: 0; max-width: none; } } /* area and view share the second row */
  /* topic headings only: the card titles inside are h3s too */
  .area > h3 { margin: 28px 0 0; font-size: 14px; color: var(--muted); font-weight: 500; }
  .area > h3 + .cards { margin-top: 10px; }
  #empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">How it works</h1>
  <div class="finder">
    <input id="q" type="search" aria-label="Search explainers" autocomplete="off">
    <select id="area" aria-label="Area"></select>
    <div class="seg" role="group" aria-label="View"><button data-view="list" aria-pressed="true">Cards</button><button data-view="map" aria-pressed="false">Map</button></div>
  </div>
  <section id="paths" hidden><h2>Learning paths</h2><div class="pathcards" id="pathcards"></div></section>
  <div id="list"></div>
  <div id="mapWrap" class="panel" hidden>
    <div class="scroll-x"><svg id="map" role="group" aria-label="Concept map of explainers and their prerequisites"></svg></div>
  </div>
  <p id="empty" hidden>Nothing matches.</p>
</main>
<script type="module">
  import { chrome, escapeHtml, readSet, entryCards, onThemeChange } from "./shared/common.js";
  import { CATALOG, AREAS, PATHS, byId, hrefOf, search } from "./catalog.js";
  chrome();

  const params = new URLSearchParams(location.search);
  let area = params.get("area") || "all";
  const q = document.getElementById("q");
  q.value = params.get("q") || "";
  q.placeholder = `Search ${CATALOG.length} explainers`;

  const present = AREAS.filter(a => CATALOG.some(c => c.area === a.id));
  const areaSel = document.getElementById("area");
  areaSel.innerHTML = [["all", "All areas"], ...present.map(a => [a.id, a.title])].map(([id, t]) => `<option value="${id}">${escapeHtml(t)}</option>`).join("");
  areaSel.value = present.some(a => a.id === area) ? area : (area = "all");
  const read = readSet();
  const order = { intro: 0, core: 1, deep: 2 };
  function render() {
    const items = search(q.value, CATALOG.filter(c => area === "all" || c.area === area));
    const list = document.getElementById("list");
    if (q.value.trim()) {
      list.innerHTML = entryCards(items, hrefOf);
    } else {
      list.innerHTML = present.filter(a => area === "all" || a.id === area).map(a => {
        const cs = items.filter(c => c.area === a.id);
        if (!cs.length) return "";
        const topics = a.topics.map(t => { const ts = cs.filter(c => c.topic === t.id).sort((x, y) => order[x.level] - order[y.level]);
          return ts.length ? `<h3 id="topic-${t.id}">${escapeHtml(t.title)}</h3>${entryCards(ts, hrefOf)}` : ""; }).join("");
        return `<section class="area" id="area-${a.id}"><h2>${escapeHtml(a.title)}</h2>${topics}</section>`;
      }).join("");
    }
    // learning paths: on the unfiltered list only
    const showPaths = view === "list" && !q.value.trim() && area === "all";
    document.getElementById("paths").hidden = !showPaths;
    if (showPaths) document.getElementById("pathcards").innerHTML = PATHS.map(p => {
      const done = p.steps.filter(id => read.has(id)).length;
      return `<a class="pathcard" id="path-${p.id}" href="path/?id=${p.id}"><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.blurb)}</p>
        <span class="prog"><i style="--p:${done / p.steps.length * 100}%"></i>${done}/${p.steps.length}</span></a>`;
    }).join("");
    document.getElementById("empty").hidden = items.length > 0;
    const u = new URLSearchParams(); if (q.value.trim()) u.set("q", q.value.trim()); if (area !== "all") u.set("area", area); if (view === "map") u.set("view", "map");
    history.replaceState(null, "", (u.toString() ? "?" + u : location.pathname) + location.hash);
    if (view === "map") drawMap();
  }
  let view = params.get("view") === "map" ? "map" : "list";
  areaSel.onchange = () => { area = areaSel.value; render(); };
  q.addEventListener("input", render);
  addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
  // ---- concept map ----
  const svgNS = "http://www.w3.org/2000/svg", el = (t, a = {}, txt) => { const e = document.createElementNS(svgNS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const depth = new Map(), D = id => { if (depth.has(id)) return depth.get(id); const c = byId(id); const d = c.prereqs.length ? 1 + Math.max(...c.prereqs.map(D)) : 0; depth.set(id, d); return d; };
  CATALOG.forEach(c => D(c.id));
  function drawMap(hl = null) {
    const svg = document.getElementById("map"); svg.replaceChildren(el("desc", {}, "Arrows point from an explainer to the ones that build on it; left to right is roughly reading order. Dashed boxes are prerequisites of the search matches. Hover over or tab to an explainer to highlight its connections."));
    const NW = 150, NH = 30, COLW = 240, ROWH = 40, BANDPAD = 14, LABELW = 200;
    // Search and category filters: draw only the matches, plus (faded) the prerequisites they build on.
    const filtering = area !== "all" || q.value.trim() !== "";
    const match = filtering ? new Set(search(q.value, CATALOG.filter(c => area === "all" || c.area === area)).map(c => c.id)) : null;
    const context = match ? new Set(CATALOG.filter(c => match.has(c.id)).flatMap(c => c.prereqs).filter(id => !match.has(id))) : new Set();
    const shown = CATALOG.filter(c => !match || match.has(c.id) || context.has(c.id)), isShown = new Set(shown.map(c => c.id));
    const usedDepths = [...new Set(shown.map(c => depth.get(c.id)))].sort((a, b) => a - b), colOf = new Map(usedDepths.map((d, i) => [d, i]));
    let y = 10; const pos = new Map(), bands = [];
    for (const a of present) {
      const items = shown.filter(c => c.area === a.id); if (!items.length) continue;
      const cols = usedDepths.map(() => []);
      items.forEach(c => cols[colOf.get(depth.get(c.id))].push(c));
      const rows = Math.max(...cols.map(c => c.length));
      bands.push({ a, y, h: rows * ROWH + BANDPAD });
      cols.forEach((col, d) => col.sort((p, q) => p.title.localeCompare(q.title)).forEach((c, i) => pos.set(c.id, { x: LABELW + d * COLW + NW / 2, y: y + BANDPAD / 2 + i * ROWH + NH / 2 })));
      y += rows * ROWH + BANDPAD;
    }
    const W = LABELW + Math.max(1, usedDepths.length) * COLW, H = y + 4;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    bands.forEach((b, i) => { svg.append(el("rect", { x: 0, y: b.y, width: W, height: b.h, fill: i % 2 ? "transparent" : css("--surface-2"), rx: 6 })); svg.append(el("text", { x: 8, y: b.y + 18, "font-size": 12, "font-weight": 700, fill: css("--muted") }, b.a.title)); });
    // Edges leave and enter horizontally; the arrowhead is drawn as its own triangle pointing straight
    // into the target box, so it never tilts with the curve.
    const AH = 8; mapEdges = []; mapNodes = new Map(); mapContext = context;
    for (const c of shown) for (const p of c.prereqs) {
      if (!isShown.has(p)) continue;
      const a = pos.get(p), b = pos.get(c.id);
      const x1 = a.x + NW / 2, x2 = b.x - NW / 2 - 1, end = x2 - AH, k = Math.max(24, (end - x1) * 0.5);
      const line = el("path", { d: `M${x1} ${a.y} C ${x1 + k} ${a.y}, ${end - k} ${b.y}, ${end} ${b.y}`, fill: "none" });
      const head = el("path", { d: `M${end} ${b.y - 4.5} L${x2} ${b.y} L${end} ${b.y + 4.5} Z` });
      svg.append(line, head); mapEdges.push({ from: p, to: c.id, line, head });
    }
    for (const c of shown) {
      const p = pos.get(c.id), ctx = context.has(c.id);
      const pre = c.prereqs.map(id => byId(id)?.title).filter(Boolean);
      const label = `${c.title}${pre.length ? `, builds on ${pre.join(", ")}` : ""}${ctx ? " (shown for context)" : ""}`;
      const g = el("a", { href: hrefOf(c), "data-id": c.id, "aria-label": label });
      g.append(el("title", {}, label));
      const rect = el("rect", { x: p.x - NW / 2, y: p.y - NH / 2, width: NW, height: NH, rx: 8, fill: css("--surface"), "stroke-dasharray": ctx ? "4 3" : "" });
      g.append(rect, el("text", { x: p.x, y: p.y + 4, "text-anchor": "middle", "font-size": 12, fill: css("--text"), "aria-hidden": "true" }, c.title.length > 22 ? c.title.slice(0, 21) + "…" : c.title));
      svg.append(g); mapNodes.set(c.id, { g, rect });
    }
    paintMap(null);
  }
  // Highlighting only restyles the nodes and edges drawn above, so focus and in-progress clicks survive it.
  let mapEdges = [], mapNodes = new Map(), mapContext = new Set(), mapHl = null;
  function paintMap(hl) {
    mapHl = hl;
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const related = hl ? new Set([hl, ...byId(hl).prereqs, ...CATALOG.filter(c => c.prereqs.includes(hl)).map(c => c.id)]) : null;
    for (const { from, to, line, head } of mapEdges) {
      const on = !hl || hl === from || hl === to, color = on && hl ? css("--accent") : css("--muted"), op = on ? 0.9 : 0.15;
      line.setAttribute("stroke", color); line.setAttribute("stroke-width", on && hl ? 2.5 : 1.3); line.setAttribute("opacity", op);
      head.setAttribute("fill", color); head.setAttribute("opacity", op);
    }
    for (const [id, { g, rect }] of mapNodes) {
      g.setAttribute("opacity", related && !related.has(id) ? 0.3 : mapContext.has(id) ? 0.55 : 1);
      rect.setAttribute("stroke", hl === id ? css("--accent") : css("--border"));
      rect.setAttribute("stroke-width", hl === id ? 2.5 : 1.5);
    }
  }
  const mapSvg = document.getElementById("map");
  const hlFrom = e => { const a = e.target.closest("[data-id]"); if (a && a.dataset.id !== mapHl) paintMap(a.dataset.id); };
  mapSvg.addEventListener("mouseover", hlFrom);
  mapSvg.addEventListener("focusin", hlFrom);
  mapSvg.addEventListener("mouseleave", () => { if (!mapSvg.contains(document.activeElement)) paintMap(null); });
  mapSvg.addEventListener("focusout", e => { if (!mapSvg.contains(e.relatedTarget)) paintMap(null); });
  function setView(v) {
    view = v; const map = v === "map";
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === v));
    document.getElementById("mapWrap").hidden = !map; document.getElementById("list").hidden = map;
    render();
  }
  document.querySelectorAll("[data-view]").forEach(b => (b.onclick = () => setView(b.dataset.view)));
  setView(view);
  onThemeChange(() => { if (view === "map") drawMap(); }); // map colours come from the theme
  // anchors like #topic-memory or #path-llms point at content drawn above, so scroll to them by hand
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
