<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge graph</title>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/theme.js"></script>
<meta name="description" content="Every explainer and what it builds on, as one map. New explainers appear on it automatically.">
<style>
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  .bar .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 300px; }
  .bar .chips button { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; padding: 4px 10px; }
  .bar .chips i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
  #stage { height: min(78vh, 900px); border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; touch-action: none; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #stage a { cursor: pointer; }
</style>
</head>
<body>
<main id="main">
  <h1>Knowledge graph</h1>
  <p class="lede" id="lede"></p>
  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="Highlight an area"></div>
    <div class="seg" role="group" aria-label="Zoom"><button id="out" aria-label="Zoom out">−</button><button id="fit">Fit</button><button id="in" aria-label="Zoom in">+</button></div>
  </div>
  <div id="stage"><svg role="group" aria-label="Knowledge graph: arrows point from an explainer to the ones that build on it"></svg></div>
</main>
<script type="module">
import { chrome, escapeHtml, linkTo } from "../shared/common.js";
import { CATALOG, AREAS } from "../catalog.js";
import { layout } from "./graph.js";
chrome();

const ns = "http://www.w3.org/2000/svg", el = (t, a = {}, txt) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
const { nodes, edges, width, height } = layout(CATALOG, AREAS), PAD = 40, R = 5;
const colour = id => `var(--${AREAS.findIndex(a => a.id === id) < 8 ? "s" + (AREAS.findIndex(a => a.id === id) + 1) : "accent"})`;
document.getElementById("lede").textContent = `${CATALOG.length} explainers in ${AREAS.length} areas. Each line runs from an explainer to one that builds on it, and areas gather into clusters. Drag to pan, scroll to zoom in for names, hover or tab to an explainer to light up its connections.`;

const stage = document.getElementById("stage"), svg = stage.querySelector("svg"), g = el("g");
const at = new Map(nodes.map(n => [n.id, n])), byId = new Map(CATALOG.map(c => [c.id, c]));
const lines = edges.map(({ from, to }) => {
  const a = at.get(from), b = at.get(to), p = el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, "stroke-width": 1, stroke: "var(--border)" });
  const dot = el("circle", { cx: (a.x + 2 * b.x) / 3, cy: (a.y + 2 * b.y) / 3, r: 1.6, fill: "var(--control-border)" }); // nearer the explainer that builds on it, so the line has a direction
  g.append(p, dot); return { from, to, p, dot };
});
const boxes = nodes.map(n => {
  const c = byId.get(n.id), a = el("a", { href: linkTo(c), "aria-label": `${c.title}${c.prereqs.length ? `, builds on ${c.prereqs.map(id => byId.get(id)?.title).filter(Boolean).join(", ")}` : ""}` });
  const label = el("text", { x: n.x, y: n.y + R + 11, "text-anchor": "middle", "font-size": 10, fill: "var(--text)", "aria-hidden": "true" }, n.title);
  a.append(el("circle", { cx: n.x, cy: n.y, r: R + 4, fill: colour(n.area), opacity: 0.2 }), el("circle", { cx: n.x, cy: n.y, r: R, fill: colour(n.area) }), label);
  g.append(a); return { n, a, label };
});
svg.append(g);

// Highlight: one explainer and its direct neighbours, or one whole area; everything else fades. Names show for the lit ones, or for all once zoomed in.
let ids = null, k = 1, tx = 0, ty = 0;
function paint(set) {
  ids = set;
  for (const { n, a, label } of boxes) { const on = !ids || ids.has(n.id); a.style.opacity = on ? 1 : 0.12; label.style.display = (ids ? on && ids.size < 40 : k >= 1.3) ? "" : "none"; }
  for (const { from, to, p, dot } of lines) { const on = ids && ids.has(from) && ids.has(to); p.style.opacity = dot.style.opacity = !ids || on ? 1 : 0.04; p.setAttribute("stroke", on ? "var(--accent)" : "var(--border)"); }
}
const near = id => new Set([id, ...byId.get(id).prereqs, ...CATALOG.filter(c => c.prereqs.includes(id)).map(c => c.id)]);
let area = null;
const show = () => paint(area ? new Set(nodes.filter(n => n.area === area).map(n => n.id)) : null);
for (const { n, a } of boxes) { for (const ev of ["mouseenter", "focus"]) a.addEventListener(ev, () => paint(near(n.id))); for (const ev of ["mouseleave", "blur"]) a.addEventListener(ev, show); }
document.getElementById("chips").innerHTML = AREAS.filter(a => CATALOG.some(c => c.area === a.id)).map(a => `<button type="button" data-a="${a.id}" aria-pressed="false" style="--c:${colour(a.id)}"><i></i>${escapeHtml(a.title)}</button>`).join("");
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  area = area === b.dataset.a ? null : b.dataset.a;
  document.querySelectorAll("#chips button").forEach(x => x.setAttribute("aria-pressed", x.dataset.a === area));
  show();
});

// Pan and zoom by transforming one group, so text stays crisp and focus survives.
const apply = () => { g.setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`); if (!ids) paint(null); };
const fit = () => { const r = stage.getBoundingClientRect(); k = Math.min(r.width / (width + 2 * PAD), r.height / (height + 2 * PAD)); tx = (r.width - width * k) / 2; ty = (r.height - height * k) / 2; apply(); };
const zoom = (f, cx, cy) => { const nk = Math.min(4, Math.max(0.1, k * f)); tx = cx - (cx - tx) * nk / k; ty = cy - (cy - ty) * nk / k; k = nk; apply(); };
const mid = () => { const r = stage.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let drag = null;
stage.addEventListener("pointerdown", e => { if (e.target.closest("a")) return; drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.classList.add("drag"); stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
stage.addEventListener("pointerup", () => { drag = null; stage.classList.remove("drag"); });
document.getElementById("in").onclick = () => zoom(1.3, ...mid());
document.getElementById("out").onclick = () => zoom(1 / 1.3, ...mid());
document.getElementById("fit").onclick = fit;
addEventListener("resize", fit);
fit();
</script>
</body>
</html>
