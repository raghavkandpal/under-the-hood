name: Check further-reading links

# External sites move or disappear over time. This fetches every link in sources.js once a week
# (and on demand from the Actions tab) and fails if any no longer loads.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check-sources
