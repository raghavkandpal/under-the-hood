<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Path</title>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/theme.js"></script>
<style>
  .outcomes { padding-left: 20px; max-width: 680px; }
  .outcomes li { margin: 2px 0; }
  ol.steps { list-style: none; padding: 0; margin: 8px 0 0; max-width: 760px; }
  ol.steps li + li { border-top: 1px solid var(--border); }
  ol.steps a { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 12px; align-items: baseline; padding: 10px 8px; margin: 0 -8px; border-radius: 6px; color: var(--text); text-decoration: none; }
  ol.steps a:hover { background: var(--surface-2); }
  ol.steps .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; align-self: start; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
  ol.steps li.read .n { background: var(--accent); color: var(--on-accent); }
  ol.steps li.next b { color: var(--accent); }
  ol.steps b { font-weight: 550; }
  ol.steps a > span:last-child { grid-column: 2; color: var(--muted); font-size: 14px; }
  .pathnext { margin: 24px 0 0; display: inline-block; }
</style>
</head>
<body>
<main id="main">
  <h1 id="title">Learning paths</h1>
  <p class="lede" id="blurb"></p>
  <div id="body"></div>
</main>
<script type="module">
import { chrome, escapeHtml, readSet, nextStep, linkTo } from "../shared/common.js";
import { PATHS, pathById, pathMinutes, byId } from "../catalog.js";
chrome();

const path = pathById(new URLSearchParams(location.search).get("id")), read = readSet();
const hours = m => (m < 90 ? `${m} min` : `${(m / 60).toFixed(m % 60 ? 1 : 0)} h`);
const bar = (p, done) => `<span class="prog"><i style="--p:${done / p.steps.length * 100}%"></i>${done}/${p.steps.length}</span>`;
if (!path) {
  // no (or unknown) id: list every path
  document.title = "Learning Paths";
  $("#blurb").remove();
  $("#body").innerHTML = `<div class="pathcards">${PATHS.map(p => `<a class="pathcard" href="./?id=${p.id}"><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.blurb)}</p>${bar(p, p.steps.filter(id => read.has(id)).length)}</a>`).join("")}</div>`;
} else {
  document.title = `${path.title} · Learning Path`;
  $("#title").textContent = path.title;
  $("#blurb").textContent = `${path.blurb} · ${path.steps.length} steps · ${hours(pathMinutes(path))}`;
  const done = path.steps.filter(id => read.has(id)).length, next = byId(nextStep(path, read)), finished = done === path.steps.length;
  $("#body").innerHTML = `
    <p>${escapeHtml(path.intro)}</p>
    <ul class="outcomes">${path.outcomes.map(o => `<li>${escapeHtml(o)}</li>`).join("")}</ul>
    <a class="pathnext" href="${linkTo(next)}?path=${path.id}">${finished ? "Read again" : done ? "Continue" : "Start"}: ${escapeHtml(next.title)} →</a>
    <h2>Steps</h2>
    ${bar(path, done)}
    <ol class="steps">${path.steps.map((id, i) => { const c = byId(id), isRead = read.has(id);
      return `<li class="${isRead ? "read" : ""}${id === next.id && !finished ? " next" : ""}"><a href="${linkTo(c)}?path=${path.id}"${id === next.id && !finished ? ' aria-current="step"' : ""}>
        <span class="n">${i + 1}</span><b>${escapeHtml(c.title)}${isRead ? '<span class="sr-only"> (read)</span>' : ""}</b><span>${escapeHtml(c.blurb)}</span></a></li>`; }).join("")}</ol>`;
}
function $(s) { return document.querySelector(s); }
</script>
</body>
</html>
